<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>RankIt</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
    <header class="toolbar">
        <input id="titleInput" value="Meu Ranking" aria-label="Título do ranking">
        <div class="stats">
        <span id="totalItems">0 itens</span>
        <span id="reviewCount">0 revisão</span>
        <span id="unrankedCount">0 não ranqueados</span>
        </div>
        <div class="controls">
        <input id="search" placeholder="Pesquisar" aria-label="Pesquisar itens">
        <button id="newBtn" type="button">Novo</button>
        <button id="toolsToggleBtn" type="button" class="tools-toggle" aria-expanded="false" aria-controls="toolsPanel">☰ Ferramentas</button>

        <div id="toolsPanel" class="tools-panel">
        <select id="filter" aria-label="Filtrar itens">
            <option value="all">Todos</option>
            <option value="ranked">Ranqueados</option>
            <option value="unranked">Não Ranqueados</option>
            <option value="review">A Revisar</option>
        </select>
        <select id="columns" aria-label="Número de colunas">
            <option value="1">1 coluna</option>
            <option value="2" selected>2 colunas</option>
            <option value="3">3 colunas</option>
        </select>
        <button id="exportListTxtBtn" type="button">Exportar Lista</button>
        <button id="importListTxtBtn" type="button">Importar Lista</button>
        <button id="exportImagesTxtBtn" type="button">Exportar Imagens</button>
        <button id="importImagesTxtBtn" type="button">Importar Imagens</button>
        </div>
        </div>
    </header>

    <main>
     <section>
        <h2>Ranking</h2>
        <div id="ranking" class="grid cols-2"></div>
     </section>
     <section>
        <h2>Não Ranqueados</h2>
        <div id="unranked" class="grid cols-2"></div>
     </section>
    </main>

    <div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-hidden="true">
        <div class="modal-box">
                <h2 id="modalTitle">Novo Item</h2>
                <p id="formError" class="form-error" hidden></p>
                <input id="nameInput" placeholder="Nome" aria-label="Nome do item">
                <input id="imageInput" placeholder="URL da imagem" aria-label="URL da imagem">
                <textarea id="noteInput" placeholder="Nota" aria-label="Nota"></textarea>
                <input id="rankInput" type="number" min="1" placeholder="Rank" aria-label="Posição no ranking">

                <label class="review-check">
                    <input id="reviewInput" type="checkbox">
                    <span class="checkmark"></span>
                    <span>A revisar</span>
                </label>
            <div class="modal-actions">
                <button id="cancelBtn" type="button">Cancelar</button>
                <button id="saveBtn" type="button">Salvar</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    </body>
</html>
